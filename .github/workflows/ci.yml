name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        preset: [cpu-serial, cpu-openmp]
    env:
      OMP_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - name: OpenMP runtime (macOS)
        if: runner.os == 'macOS' && matrix.preset == 'cpu-openmp'
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
